# =============================================================================
# OpenBoxes per-client override configuration — TEMPLATE
#
# Copy this file to `openboxes-config.properties` (or mount it directly at
# /app/.grails/openboxes-config.properties) and uncomment / edit the values
# the client needs. Anything left commented falls back to the defaults in
# grails-app/conf/application.yml.
#
# Loading order (last wins) is defined in application.yml:
#   1. classpath:META-INF/grails.build.info
#   2. ${catalina.base}/.grails/openboxes-config.properties   <-- this file
#   3. ${catalina.base}/.grails/openboxes-config.groovy
#   4. ${catalina.base}/.grails/openboxes.yml
#   5. ~/.grails/openboxes-config.properties
#   6. ~/.grails/openboxes-config.groovy
#   7. ~/.grails/openboxes.yml
#
# Properties-file gotchas:
#   - Lists use bracket indexing: foo.bar[0]=a, foo.bar[1]=b
#   - No nested blocks, no GString interpolation — use openboxes-config.groovy
#     if you need conditional logic or env-specific overrides.
# =============================================================================


# -----------------------------------------------------------------------------
# Database
# In docker-compose.yml these are normally provided via DATASOURCE_* env vars.
# Uncomment here only if you are NOT using the env-var path.
# -----------------------------------------------------------------------------
# dataSource.url = jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false
# dataSource.username = openboxes
# dataSource.password = CHANGE_ME


# -----------------------------------------------------------------------------
# Server / session
# -----------------------------------------------------------------------------
# server.contextPath = /openboxes
# server.session.timeout = 7200


# -----------------------------------------------------------------------------
# Branding (UI logo + report logo)
# -----------------------------------------------------------------------------
# openboxes.logo.url = ${server.contextPath}/assets/client_logo_40x40.png
# openboxes.logo.label = Client Name
# openboxes.report.logo.url = https://client.example.com/img/logo_100.png


# -----------------------------------------------------------------------------
# Mail / SMTP
# Disabled by default. Enable + fill in for outbound notifications.
# -----------------------------------------------------------------------------
grails.mail.enabled = false
# grails.mail.host = smtp.example.com
# grails.mail.port = 587
# grails.mail.username = noreply@client.example.com
# grails.mail.password = CHANGE_ME
# grails.mail.from = noreply@client.example.com
# grails.mail.prefix = [OpenBoxes - ClientName]

# Feedback and error email recipients (lists — use bracket indexing)
# openboxes.mail.feedback.enabled = true
# openboxes.mail.feedback.recipients[0] = ops@client.example.com

# openboxes.mail.errors.enabled = true
# openboxes.mail.errors.recipients[0] = errors@client.example.com

# Separate "error mail" channel (legacy — mail.error.* in application.yml)
# mail.error.enabled = false
# mail.error.to = errors@client.example.com
# mail.error.server = smtp.example.com
# mail.error.port = 587
# mail.error.from = noreply@client.example.com
# mail.error.username = noreply@client.example.com
# mail.error.password = CHANGE_ME


# -----------------------------------------------------------------------------
# Admin
# -----------------------------------------------------------------------------
# openboxes.admin.email = admin@client.example.com


# -----------------------------------------------------------------------------
# Locale & currency
# Lists use bracket indexing.
# -----------------------------------------------------------------------------
# openboxes.locale.defaultLocale = en
# openboxes.locale.supportedLocales[0] = en
# openboxes.locale.supportedLocales[1] = es
# openboxes.locale.supportedLocales[2] = fr

# openboxes.locale.defaultCurrencyCode = USD
# openboxes.locale.defaultCurrencySymbol = $
# openboxes.locale.supportedCurrencyCodes[0] = USD
# openboxes.locale.supportedCurrencyCodes[1] = EUR

# Exchange-rate sync (only if updateExchangeRatesJob is enabled)
# openboxes.locale.currencyApi.apiKey = CHANGE_ME


# -----------------------------------------------------------------------------
# Fiscal year (dashboard reporting)
# Format: MM/DD. Default is PIH-style 07/01–06/30.
# -----------------------------------------------------------------------------
# openboxes.dashboard.yearTypes.fiscalYear.start = 01/01
# openboxes.dashboard.yearTypes.fiscalYear.end = 12/31
# openboxes.dashboard.yearTypes.fiscalYear.labelYearPrefix = FY
# openboxes.dashboard.yearTypes.fiscalYear.yearFormat = yyyy


# -----------------------------------------------------------------------------
# Identifier formats
# N=digit, L=uppercase letter, A=alphanumeric. Sequence pattern per record type.
# -----------------------------------------------------------------------------
openboxes.identifier.order.format = NNNLLL
openboxes.identifier.product.format = LLNN
openboxes.identifier.requisition.format = NNNLLL
openboxes.identifier.shipment.format = NNNLLL
openboxes.identifier.transaction.format = AAA-AAA-AAA


# -----------------------------------------------------------------------------
# Login / location selection
# Activities required on a Location for users to log into it.
# -----------------------------------------------------------------------------
# openboxes.chooseLocation.requiredActivities[0] = MANAGE_INVENTORY


# -----------------------------------------------------------------------------
# Receiving
# -----------------------------------------------------------------------------
# openboxes.receiving.createReceivingLocation.enabled = true
# openboxes.receiving.receivingLocation.prefix = R


# -----------------------------------------------------------------------------
# Expiration date floor
# Format: MM/DD/YYYY. Earliest expiry the UI will accept.
# -----------------------------------------------------------------------------
# openboxes.expirationDate.minValue = 01/01/2000


# -----------------------------------------------------------------------------
# Forecasting
# -----------------------------------------------------------------------------
# openboxes.forecasting.enabled = true
# openboxes.forecasting.demandPeriod = 365


# -----------------------------------------------------------------------------
# Signup / reCAPTCHA
# Disable signup for closed deployments. If kept enabled, set reCAPTCHA keys.
# -----------------------------------------------------------------------------
# openboxes.signup.enabled = false
# openboxes.signup.recaptcha.enabled = false
# openboxes.signup.recaptcha.v2.siteKey = CHANGE_ME
# openboxes.signup.recaptcha.v2.secretKey = CHANGE_ME


# -----------------------------------------------------------------------------
# LDAP (optional — enable only for clients using corporate auth)
# -----------------------------------------------------------------------------
# openboxes.ldap.enabled = false
# openboxes.ldap.context.managerDn = cn=svc-openboxes,dc=client,dc=example,dc=com
# openboxes.ldap.context.managerPassword = CHANGE_ME
# openboxes.ldap.context.server.host = ldap.client.example.com
# openboxes.ldap.context.server.port = 389
# openboxes.ldap.search.base = dc=client,dc=example,dc=com
# openboxes.ldap.search.filter = (uid={0})
# openboxes.ldap.search.searchSubtree = true
# openboxes.ldap.search.attributesToReturn[0] = mail
# openboxes.ldap.search.attributesToReturn[1] = givenName


# -----------------------------------------------------------------------------
# Sentry (error tracking)
# Prefer the SENTRY_DSN_BACKEND env var (read at line 690 of application.yml).
# Use this key only if env-var injection isn't available.
# -----------------------------------------------------------------------------
# sentry.dsn = https://PUBLIC_KEY@sentry.io/PROJECT_ID


# -----------------------------------------------------------------------------
# Barcode scanner / printer
# -----------------------------------------------------------------------------
openboxes.scannerDetection.enabled = false
# openboxes.barcode.printer.name = printer-thermalprinter
# openboxes.barcode.printer.ipAddress = 127.0.0.1
# openboxes.barcode.printer.port = 9100


# -----------------------------------------------------------------------------
# Job schedules
# Cron expressions are Quartz format: sec min hour day-of-month month day-of-week
# -----------------------------------------------------------------------------
# Stock alert email — days-of-expiry threshold + when to run
# openboxes.jobs.sendStockAlertsJob.enabled = true
# openboxes.jobs.sendStockAlertsJob.daysUntilExpiry = 60
# openboxes.jobs.sendStockAlertsJob.cronExpression = 0 0 0 * * ?

# Product availability materialised view refresh (hot path — keep aggressive)
# openboxes.jobs.refreshProductAvailabilityJob.cronExpression = 0 0 0/2 * * ?

# Historical QoH backfill — off by default; turn on for clients that want it
# openboxes.jobs.calculateHistoricalQuantityJob.enabled = false
# openboxes.jobs.calculateHistoricalQuantityJob.daysToProcess = 540

# Exchange-rate sync — off by default
# openboxes.jobs.updateExchangeRatesJob.enabled = false


# -----------------------------------------------------------------------------
# Third-party widgets
# All disabled below by default. HelpScout in upstream defaults ships ENABLED
# with PIH's beacon key — explicitly disable for client deployments unless
# they have their own beacon configured.
# -----------------------------------------------------------------------------
openboxes.helpscout.widget.enabled = false
# openboxes.helpscout.widget.key = CLIENT_BEACON_KEY
# openboxes.helpscout.widget.color = #3AB4B1

openboxes.fullstory.enabled = false
# openboxes.fullstory.org = CLIENT_FS_ORG

openboxes.hotjar.enabled = false
# openboxes.hotjar.hjid = 0

openboxes.uservoice.widget.enabled = false
openboxes.zopim.widget.enabled = false
openboxes.jira.issue.collector.enabled = false


# -----------------------------------------------------------------------------
# Anonymisation (rarely enabled — only if the client wants user data masked)
# -----------------------------------------------------------------------------
# openboxes.anonymize.enabled = false
