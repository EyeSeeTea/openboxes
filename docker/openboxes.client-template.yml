# =============================================================================
# OpenBoxes per-client override configuration — TEMPLATE
#
# Copy this file to `openboxes.yml` (or mount it directly at
# /app/.grails/openboxes.yml) and uncomment / edit the values the client
# needs. Anything left commented falls back to the defaults in
# grails-app/conf/application.yml.
#
# Loading order (last wins) is defined in application.yml:
#   1. classpath:META-INF/grails.build.info
#   2. ${catalina.base}/.grails/openboxes-config.properties
#   3. ${catalina.base}/.grails/openboxes-config.groovy
#   4. ${catalina.base}/.grails/openboxes.yml          <-- this file
#   5. ~/.grails/openboxes-config.properties
#   6. ~/.grails/openboxes-config.groovy
#   7. ~/.grails/openboxes.yml
#
# YAML notes:
#   - Indentation matters: 4 spaces (matches application.yml). No tabs.
#   - Lists use real YAML arrays — much cleaner than the legacy properties-file
#     bracket-indexing (foo[0]=a, foo[1]=b).
#   - Setting a list here REPLACES the upstream list (no append). When pulling
#     upstream, diff against application.yml and add any new entries here.
#   - Use openboxes-config.groovy if you need conditional logic or env-specific
#     overrides.
#   - Secrets (DB passwords, SMTP passwords, API keys) should NOT be committed —
#     inject via env vars in docker-compose.yml or a sysadmin-managed override
#     file at deploy time.
# =============================================================================


# -----------------------------------------------------------------------------
# Database
# In docker-compose.yml these are normally provided via DATASOURCE_* env vars.
# Uncomment here only if you are NOT using the env-var path.
# -----------------------------------------------------------------------------
# dataSource:
#     url: jdbc:mysql://db/openboxes?serverTimezone=UTC&useSSL=false
#     username: openboxes
#     password: CHANGE_ME


# -----------------------------------------------------------------------------
# Server / session
# -----------------------------------------------------------------------------
# server:
#     contextPath: /openboxes
#     session:
#         timeout: 7200


# -----------------------------------------------------------------------------
# Mail / SMTP
# Disabled by default. Enable + fill in for outbound notifications.
# Passwords belong in env vars or a sysadmin-managed file, NOT here.
# -----------------------------------------------------------------------------
grails:
    mail:
        enabled: false
        # host: smtp.example.com
        # port: 587
        # username: noreply@client.example.com
        # password: CHANGE_ME
        # from: noreply@client.example.com
        # prefix: '[OpenBoxes - ClientName]'

# Separate "error mail" channel (legacy — mail.error.* in application.yml)
# mail:
#     error:
#         enabled: false
#         to: errors@client.example.com
#         server: smtp.example.com
#         port: 587
#         from: noreply@client.example.com
#         username: noreply@client.example.com
#         password: CHANGE_ME


openboxes:

    # -------------------------------------------------------------------------
    # Branding (UI logo + report logo)
    # -------------------------------------------------------------------------
    # logo:
    #     url: ${server.contextPath}/assets/client_logo_40x40.png
    #     label: Client Name
    # report:
    #     logo:
    #         url: https://client.example.com/img/logo_100.png

    # -------------------------------------------------------------------------
    # Mail recipients (feedback / error channels)
    # -------------------------------------------------------------------------
    # mail:
    #     feedback:
    #         enabled: true
    #         recipients:
    #             - ops@client.example.com
    #     errors:
    #         enabled: true
    #         recipients:
    #             - errors@client.example.com

    # -------------------------------------------------------------------------
    # Admin (currently unused in code — see LOCATION_CODES_ACTIONS notes)
    # -------------------------------------------------------------------------
    # admin:
    #     email: admin@client.example.com

    # -------------------------------------------------------------------------
    # Locale & currency
    # Setting `supportedLocales` here REPLACES the upstream list — list every
    # locale the client needs (including 'en' if applicable). Each entry must
    # have a matching messages_<locale>.properties under grails-app/i18n/.
    # -------------------------------------------------------------------------
    # locale:
    #     defaultLocale: en
    #     localizationModeLocale: en
    #     supportedLocales: ['en', 'es', 'fr']
    #     defaultCurrencyCode: USD
    #     defaultCurrencySymbol: '$'
    #     supportedCurrencyCodes: ['USD', 'EUR']
    #     # Exchange-rate sync (only if updateExchangeRatesJob is enabled)
    #     currencyApi:
    #         apiKey: CHANGE_ME

    # -------------------------------------------------------------------------
    # Fiscal year (dashboard reporting)
    # Format: MM/DD. Default is PIH-style 07/01–06/30.
    # -------------------------------------------------------------------------
    # dashboard:
    #     yearTypes:
    #         fiscalYear:
    #             start: 01/01
    #             end: 12/31
    #             labelYearPrefix: FY
    #             yearFormat: yyyy

    # -------------------------------------------------------------------------
    # Identifier formats
    # N=digit, L=uppercase letter, A=alphanumeric. Sequence pattern per record.
    # -------------------------------------------------------------------------
    identifier:
        order:
            format: NNNLLL
        product:
            format: LLNN
        requisition:
            format: NNNLLL
        shipment:
            format: NNNLLL
        transaction:
            format: AAA-AAA-AAA

    # -------------------------------------------------------------------------
    # Login / location selection
    # Activities required on a Location for users to log into it.
    # -------------------------------------------------------------------------
    # chooseLocation:
    #     requiredActivities: ['MANAGE_INVENTORY']

    # -------------------------------------------------------------------------
    # Receiving
    # -------------------------------------------------------------------------
    # receiving:
    #     createReceivingLocation:
    #         enabled: true
    #     receivingLocation:
    #         prefix: R

    # -------------------------------------------------------------------------
    # Expiration date floor
    # Format: MM/DD/YYYY. Earliest expiry the UI will accept.
    # -------------------------------------------------------------------------
    # expirationDate:
    #     minValue: 01/01/2000

    # -------------------------------------------------------------------------
    # Forecasting
    # -------------------------------------------------------------------------
    # forecasting:
    #     enabled: true
    #     demandPeriod: 365

    # -------------------------------------------------------------------------
    # Signup / reCAPTCHA
    # Disable signup for closed deployments. If kept enabled, set reCAPTCHA keys.
    # -------------------------------------------------------------------------
    # signup:
    #     enabled: false
    #     recaptcha:
    #         enabled: false
    #         v2:
    #             siteKey: CHANGE_ME
    #             secretKey: CHANGE_ME

    # -------------------------------------------------------------------------
    # Custom: damaged stock adjustments
    # Default is false (only programmatic damaged transactions are allowed).
    # Set to true to re-enable the user-initiated Adjust Stock / Create Damaged
    # Transaction paths (e.g. for a site that does not use the transfer-to-Damaged-
    # bin workflow).
    # -------------------------------------------------------------------------
    # custom:
    #     adjustments:
    #         damaged:
    #             enabled: false

    # -------------------------------------------------------------------------
    # LDAP (optional — enable only for clients using corporate auth)
    # -------------------------------------------------------------------------
    # ldap:
    #     enabled: false
    #     context:
    #         managerDn: cn=svc-openboxes,dc=client,dc=example,dc=com
    #         managerPassword: CHANGE_ME
    #         server:
    #             host: ldap.client.example.com
    #             port: 389
    #     search:
    #         base: dc=client,dc=example,dc=com
    #         filter: (uid={0})
    #         searchSubtree: true
    #         attributesToReturn: ['mail', 'givenName']

    # -------------------------------------------------------------------------
    # Barcode scanner / printer
    # -------------------------------------------------------------------------
    scannerDetection:
        enabled: false
    # barcode:
    #     printer:
    #         name: printer-thermalprinter
    #         ipAddress: 127.0.0.1
    #         port: 9100

    # -------------------------------------------------------------------------
    # Job schedules
    # Cron expressions are Quartz format: sec min hour day-of-month month day-of-week
    # -------------------------------------------------------------------------
    # jobs:
    #     # Stock alert email — days-of-expiry threshold + when to run
    #     sendStockAlertsJob:
    #         enabled: true
    #         daysUntilExpiry: 60
    #         cronExpression: 0 0 0 * * ?
    #     # Product availability materialised view refresh (hot path — keep aggressive)
    #     refreshProductAvailabilityJob:
    #         cronExpression: 0 0 0/2 * * ?
    #     # Historical QoH backfill — off by default; turn on for clients that want it
    #     calculateHistoricalQuantityJob:
    #         enabled: false
    #         daysToProcess: 540
    #     # Exchange-rate sync — off by default
    #     updateExchangeRatesJob:
    #         enabled: false

    # -------------------------------------------------------------------------
    # Third-party widgets
    # All disabled below by default. HelpScout in upstream defaults ships ENABLED
    # with PIH's beacon key — explicitly disable for client deployments unless
    # they have their own beacon configured.
    # -------------------------------------------------------------------------
    helpscout:
        widget:
            enabled: false
            # key: CLIENT_BEACON_KEY
            # color: '#3AB4B1'

    fullstory:
        enabled: false
        # org: CLIENT_FS_ORG

    hotjar:
        enabled: false
        # hjid: 0

    uservoice:
        widget:
            enabled: false

    zopim:
        widget:
            enabled: false

    jira:
        issue:
            collector:
                enabled: false

    # -------------------------------------------------------------------------
    # Anonymisation (rarely enabled — only if the client wants user data masked)
    # -------------------------------------------------------------------------
    # anonymize:
    #     enabled: false


# -----------------------------------------------------------------------------
# Sentry (error tracking)
# Prefer the SENTRY_DSN_BACKEND env var (read by application.yml).
# Use this key only if env-var injection isn't available.
# -----------------------------------------------------------------------------
# sentry:
#     dsn: https://PUBLIC_KEY@sentry.io/PROJECT_ID
