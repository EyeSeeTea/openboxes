# Per-client overrides for the TJK deployment.
# Secrets (SMTP password, etc.) should be injected via env vars or a
# sysadmin-managed override file at deploy time — fill in CHANGE_ME below
# only on the deployed instance, do not commit real credentials.

grails:
    mail:
        enabled: true
        host: smtp.example.com
        port: 587
        username: noreply@example.com
        password: CHANGE_ME
        from: noreply@example.com
        prefix: '[UNICEF TJK Openboxes]'

openboxes:
    logo:
        url: ${server.contextPath}/assets/unicef_tjk_logo.png
    report:
        logo:
            url: ${server.contextPath}/assets/unicef_tjk_logo.png

    locale:
        supportedLocales: ['en', 'ru', 'tg']

    expirationDate:
      minValue: "01/01/2026"

    jobs:
        sendStockAlertsJob:
            enabled: true
            daysUntilExpiry: 90
            cronExpression: 0 0 0 * * ?

        # Gates our InventorySnapshotEtlService — restores Phase 2 of OBPIH-3280
        # so stock alerts actually have data (openboxes/openboxes#4742).
        # Already defaults to true in upstream application.yml; set explicitly
        # here so the fix survives if upstream eventually removes the orphan key
        # during housekeeping.
        refreshInventorySnapshotAfterTransactionJob:
            enabled: true
