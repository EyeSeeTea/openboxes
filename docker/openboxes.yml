# =============================================================================
# OpenBoxes override configuration
# Mounted into the container at /app/.grails/openboxes.yml
# These values override defaults set in grails-app/conf/application.yml.
# Secrets (DB / SMTP passwords) are NOT committed — inject via env vars in
# docker-compose.yml or a sysadmin-managed override file at deploy time.
# =============================================================================

# Database — overridden by DATASOURCE_* env vars in docker-compose,
# but kept here (commented) as a fallback reference.
# dataSource:
#     url: jdbc:mysql://db/openboxes?useSSL=false
#     username: openboxes
#     password: openboxes

# Mail (disabled by default — configure to enable)
grails:
    mail:
        enabled: false
        # host: smtp.example.com
        # port: 587
        # username: user@example.com
        # password: secret
        # from: noreply@example.com

openboxes:

    # Admin email (currently unused in code)
    # admin:
    #     email: admin@example.com

    # Barcode scanner (disabled by default)
    scannerDetection:
        enabled: false

    # Identifier formats
    # N=digit, L=uppercase letter, A=alphanumeric.
    identifier:
        order:
            format: NNNLLL
        product:
            format: LLNN
        requisition:
            format: NNNLLL
        shipment:
            format: NNNLLL
        transaction:
            format: AAA-AAA-AAA
