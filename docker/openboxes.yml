# Per-client overrides for the TJK deployment.
# Secrets (SMTP password, etc.) should be injected via env vars or a
# sysadmin-managed override file at deploy time — fill in CHANGE_ME below
# only on the deployed instance, do not commit real credentials.

grails:
    mail:
        enabled: true
        host: smtp.example.com
        port: 587
        username: noreply@example.com
        password: CHANGE_ME
        from: noreply@example.com
        prefix: '[UNICEF TJK Openboxes]'

openboxes:
    logo:
        url: ${server.contextPath}/assets/unicef_tjk_logo.png
    report:
        logo:
            url: ${server.contextPath}/assets/unicef_tjk_logo.png

    locale:
        supportedLocales: ['en', 'ru', 'tg']

    expirationDate:
      minValue: "01/01/2026"

    custom:
        adjustments:
            damaged:
                enabled: false

        # -------------------------------------------------------------------------
        # DHIS2 OAuth2 SSO — TODO(TJK): fill in real values, then set enabled: true.
        # Register redirectUri exactly as shown in DHIS2 → System Settings → OAuth2
        # Clients. Inject clientSecret via env var / deploy-time override — never
        # commit the real secret. See openboxes.client-template.yml for v40/v42 notes.
        # -------------------------------------------------------------------------
        dhis2:
            oauth:
                enabled: false
                profile: v42
                clientId: openboxes
                clientSecret: CHANGE_ME
                authorizeUrl: https://dhis2.example.com/oauth2/authorize
                tokenUrl: https://dhis2.example.com/oauth2/token
                redirectUri: https://openboxes.example.com/oauth/dhis2/callback
                scopes: openid username
                clientAuth: basic

        # DHIS2 iframe embedding — set frameAncestors to the DHIS2 origin(s) allowed
        # to embed OB (empty = no third-party embedding). A non-empty list also turns
        # on silent SSO and SameSite=None cookies (requires server.use-forward-headers
        # below behind a TLS proxy). See openboxes.client-template.yml for the full note.
        iframe:
            frameAncestors: []

    jobs:
        sendStockAlertsJob:
            enabled: true
            daysUntilExpiry: 90
            cronExpression: 0 0 0 * * ?

        # Gates our InventorySnapshotEtlService — restores Phase 2 of OBPIH-3280
        # so stock alerts actually have data (openboxes/openboxes#4742).
        # Already defaults to true in upstream application.yml; set explicitly
        # here so the fix survives if upstream eventually removes the orphan key
        # during housekeeping.
        refreshInventorySnapshotAfterTransactionJob:
            enabled: true

# Forwarded-proto — root-level key, a sibling of `openboxes` (NOT under it).
# REQUIRED when OB runs behind a TLS-terminating proxy (the iframe-embedding case):
# it lets OB trust X-Forwarded-Proto so it stamps the SameSite=None session cookie
# Secure and builds https self-links. Harmless when not behind a proxy.
server:
    use-forward-headers: true
