version: "3.8"

# Spike-only compose file: DHIS2 + postgres, no OB, no nginx.
# Full dev stack (with OB, nginx, TLS) lives in docker-compose.yml in this
# same directory (owned by dhis2-iframe-embedding).
#
# Usage:
#   docker compose -f docker/dhis2-sso/docker-compose.spike.yml up -d
#   curl -u admin:district http://localhost:8080/api/me
#
# Pinned tag: dhis2/core:2.40.0 — this is the DHIS2 version both follow-up
# changes target. Update the pin in both files if the version is bumped.

services:
  dhis2-db:
    image: postgis/postgis:13-3.3-alpine
    environment:
      POSTGRES_DB: dhis2
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
    volumes:
      - dhis2-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis -d dhis2"]
      interval: 10s
      timeout: 5s
      retries: 10

  dhis2:
    image: dhis2/core:2.40.0
    depends_on:
      dhis2-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DHIS2_DATABASE_HOST: dhis2-db
      DHIS2_DATABASE_PORT: 5432
      DHIS2_DATABASE_NAME: dhis2
      DHIS2_DATABASE_USERNAME: dhis
      DHIS2_DATABASE_PASSWORD: dhis
    volumes:
      - dhis2-home:/DHIS2_home

volumes:
  dhis2-db-data:
  dhis2-home:
