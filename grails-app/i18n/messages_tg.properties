report.cycleCountReport.instructions.label=\u0418\u043d \u0433\u0443\u0437\u043e\u0440\u0438\u0448 \u0431\u0430 \u0448\u0443\u043c\u043e \u04b3\u0430\u043c\u0430 \u0447\u0438\u0437\u0440\u043e \u0434\u0430\u0440 \u0438\u043d\u0432\u0435\u043d\u0442\u0430\u0440\u0438\u0437\u0430\u0442\u0441\u0438\u044f\u0438 \u043c\u0430\u043a\u043e\u043d\u0438 \u0448\u0443\u043c\u043e \u043d\u0438\u0448\u043e\u043d \u043c\u0435\u0434\u0438\u04b3\u0430\u0434, \u0431\u043e \u043c\u0430\u044a\u043b\u0443\u043c\u043e\u0442\u0438 \u0438\u043b\u043e\u0432\u0430\u0433\u04e3 \u0431\u0430\u0440\u043e\u0438 \u043c\u0443\u0430\u0439\u044f\u043d \u043a\u0430\u0440\u0434\u0430\u043d\u0438 \u0430\u0448\u0451\u0438 \u04b3\u0438\u0441\u043e\u0431\u0448\u0443\u0434\u0430. \u0411\u0430\u0440\u043e\u0438 \u0430\u043d\u04b7\u043e\u043c \u0434\u043e\u0434\u0430\u043d\u0438 \u04b3\u0438\u0441\u043e\u0431\u043a\u0443\u043d\u0438\u0438 \u0434\u0430\u0432\u0440\u0430, \u0444\u0430\u0439\u043b\u0438 Excel-\u0440\u043e \u0437\u0435\u0440\u043a\u0430\u0448\u04e3 \u043a\u0443\u043d\u0435\u0434 \u0432\u0430 \u043c\u0435\u044a\u0451\u0440\u04b3\u043e\u0438 \u0444\u0438\u043b\u0442\u0440\u0440\u043e \u0438\u0441\u0442\u0438\u0444\u043e\u0434\u0430 \u0431\u0430\u0440\u0435\u0434, \u0442\u043e \u043c\u0443\u0430\u0439\u044f\u043d \u043a\u0443\u043d\u0435\u0434, \u043a\u0438 \u043a\u0430\u0434\u043e\u043c \u0430\u0448\u0451\u0440\u043e \u0448\u0443\u043c\u043e \u043c\u0435\u0445\u043e\u04b3\u0435\u0434 \u04b3\u0438\u0441\u043e\u0431 \u043a\u0443\u043d\u0435\u0434. \u041c\u0430\u0441\u0430\u043b\u0430\u043d, \u0448\u0443\u043c\u043e \u043c\u0435\u0442\u0430\u0432\u043e\u043d\u0435\u0434 \u0438\u043d\u0442\u0438\u0445\u043e\u0431 \u043a\u0443\u043d\u0435\u0434, \u043a\u0438 \u04b3\u0430\u043c\u0430\u0438 \u04b7\u0443\u0437\u044a\u04b3\u043e\u0438 \u0441\u0438\u043d\u0444\u0438 ABC "A" \u0451 25 \u0430\u0448\u0451\u0435, \u043a\u0438 \u0434\u0435\u0440\u0442\u0430\u0440 \u04b3\u0438\u0441\u043e\u0431 \u043a\u0430\u0440\u0434\u0430 \u0448\u0443\u0434\u0430\u0430\u043d\u0434, \u04b3\u0438\u0441\u043e\u0431 \u043a\u0443\u043d\u0435\u0434. \u0411\u043e\u0432\u0430\u0440\u04e3 \u04b3\u043e\u0441\u0438\u043b \u043a\u0443\u043d\u0435\u0434, \u043a\u0438 \u0442\u0430\u043c\u043e\u043c\u0438 \u0437\u0430\u0445\u0438\u0440\u0430\u04b3\u043e\u0438 \u043c\u0430\u04b3\u0441\u0443\u043b\u043e\u0442\u0440\u043e \u0434\u0430\u0440 \u044f\u043a \u04b3\u0438\u0441\u043e\u0431 \u04b3\u0438\u0441\u043e\u0431 \u043a\u0443\u043d\u0435\u0434 - \u0430\u0433\u0430\u0440 \u0448\u0443\u043c\u043e \u043b\u043e\u0442\u04b3\u043e\u0438 \u043c\u0443\u0430\u0439\u044f\u043d\u0440\u043e \u0431\u0430\u0440\u043e\u0438 \u043c\u0430\u04b3\u0441\u0443\u043b\u043e\u0442 \u04b3\u0438\u0441\u043e\u0431 \u043a\u0443\u043d\u0435\u0434, \u043d\u0430 \u0434\u0438\u0433\u0430\u0440\u043e\u043d, \u0448\u0443\u043c\u043e \u043c\u0435\u0442\u0430\u0432\u043e\u043d\u0435\u0434 \u04b3\u0430\u043d\u0433\u043e\u043c\u0438 \u0432\u043e\u0440\u0438\u0434\u043e\u0442 \u0431\u0430 \u043c\u0443\u0448\u043a\u0438\u043b\u043e\u0442 \u0434\u0443\u0447\u043e\u0440 \u0448\u0430\u0432\u0435\u0434. \u041f\u0430\u0441 \u0430\u0437 \u043e\u043d \u043a\u0438 \u0448\u0443\u043c\u043e \u0430\u0448\u0451\u0440\u043e \u0431\u0430\u0440\u043e\u0438 \u04b3\u0438\u0441\u043e\u0431 \u043a\u0430\u0440\u0434\u0430\u043d \u043c\u0443\u0430\u0439\u044f\u043d \u043a\u0430\u0440\u0434\u0435\u0434, \u04b7\u0443\u0437\u044a\u04b3\u043e\u0438 \u0434\u0438\u0433\u0430\u0440\u0440\u043e \u0430\u0437 \u0444\u0430\u0439\u043b\u0438 Excel \u043d\u0435\u0441\u0442 \u043a\u0443\u043d\u0435\u0434. \u04b2\u0430\u043d\u0433\u043e\u043c\u0435 \u043a\u0438 \u0448\u0443\u043c\u043e \u04b3\u0438\u0441\u043e\u0431\u04b3\u043e\u0440\u043e \u043c\u0435\u0433\u0443\u0437\u0430\u0440\u0435\u0434, \u043c\u0438\u049b\u0434\u043e\u0440\u0438 \u0444\u0438\u0437\u0438\u043a\u0438\u0440\u043e \u0431\u0430\u0440\u043e\u0438 \u04b3\u0430\u0440 \u044f\u043a \u043b\u043e\u0442 \u0432\u0430 \u043a\u043e\u043c\u0431\u0438\u043d\u0430\u0442\u0441\u0438\u044f\u0438 \u04b7\u043e\u0439\u0433\u0438\u0440\u0448\u0430\u0432\u04e3 \u0434\u0430\u0440 \u0441\u0443\u0442\u0443\u043d\u0438 "QOH \u04b7\u0438\u0441\u043c\u043e\u043d\u04e3" \u049b\u0430\u0439\u0434 \u043a\u0443\u043d\u0435\u0434. \u0411\u0430\u0440\u043e\u0438 \u0442\u0430\u0493\u0438\u0440 \u0434\u043e\u0434\u0430\u043d\u0438 \u043c\u0438\u049b\u0434\u043e\u0440\u0438 \u0437\u0438\u0451\u0434, \u0441\u0430\u043d\u0430\u0438 \u0438\u0441\u0442\u0438\u0444\u043e\u0434\u0430 \u0451 \u0440\u0430\u049b\u0430\u043c\u0438 \u0431\u0438\u043d\u04e3, \u0442\u0430\u043d\u04b3\u043e \u04b3\u0443\u04b7\u0430\u0439\u0440\u0430\u0440\u043e \u0431\u043e \u043c\u0430\u044a\u043b\u0443\u043c\u043e\u0442\u0438 \u043d\u0430\u0432 \u043d\u0430\u0432\u0441\u043e\u0437\u04e3 \u043a\u0443\u043d\u0435\u0434. \u0411\u0430\u0440\u043e\u0438 \u0442\u0430\u049b\u0441\u0438\u043c \u043a\u0430\u0440\u0434\u0430\u043d\u0438 \u043c\u0438\u049b\u0434\u043e\u0440 \u0431\u0430\u0439\u043d\u0438 \u0434\u0443 \u043b\u043e\u0442 \u0451 \u049b\u0443\u0442\u0442\u0438\u04b3\u043e, \u0441\u0430\u0442\u0440 \u0433\u0443\u0437\u043e\u0440\u0435\u0434 \u0432\u0430 \u0440\u0430\u043c\u0437\u0438 \u043c\u0430\u04b3\u0441\u0443\u043b\u043e\u0442, \u043d\u043e\u043c, \u043b\u043e\u0442, \u0441\u0430\u043d\u0430\u0438 \u0438\u0441\u0442\u0438\u0444\u043e\u0434\u0430, \u0431\u0438\u043d \u0432\u0430 QOH \u0444\u0438\u0437\u0438\u043a\u0438\u0440\u043e \u043f\u0443\u0440 \u043a\u0443\u043d\u0435\u0434 - \u0448\u0443\u043c\u043e \u043c\u0435\u0442\u0430\u0432\u043e\u043d\u0435\u0434 OB QOH-\u0440\u043e \u0445\u043e\u043b\u04e3 \u0433\u0443\u0437\u043e\u0440\u0435\u0434. \u041f\u0430\u0441 \u0430\u0437 \u043f\u0443\u0440 \u043a\u0430\u0440\u0434\u0430\u043d\u0438 \u043d\u0430\u0442\u0438\u04b7\u0430\u04b3\u043e\u0438 \u04b3\u0438\u0441\u043e\u0431, \u043d\u0443\u0441\u0445\u0430\u0438 \u043e\u043d\u0440\u043e \u0437\u0430\u0445\u0438\u0440\u0430 \u043a\u0443\u043d\u0435\u0434. \u0421\u0443\u043f\u0435\u0440\u043a\u043e\u0440\u0431\u0430\u0440 \u043c\u0435\u0442\u0430\u0432\u043e\u043d\u0430\u0434 \u0430\u0440\u0437\u0438\u0448\u04b3\u043e\u0438 \u043d\u0430\u0432\u0440\u043e \u0442\u0430\u0432\u0430\u0441\u0441\u0443\u0442\u0438 \u0432\u043e\u0440\u0438\u0434 \u043a\u0430\u0440\u0434\u0430\u043d\u0438 \u043c\u0430\u044a\u043b\u0443\u043c\u043e\u0442 \u0434\u0430\u0440 \u043c\u0435\u043d\u044e\u0438 \u043a\u043e\u043d\u0444\u0438\u0433\u0443\u0440\u0430\u0442\u0441\u0438\u044f \u0432\u0430 \u0438\u043d\u0442\u0438\u0445\u043e\u0431\u0438 "\u0418\u043d\u0432\u0435\u043d\u0442\u0430\u0440\u0438\u0437\u0430\u0442\u0441\u0438\u044f" \u0432\u043e\u0440\u0438\u0434 \u043a\u0443\u043d\u0430\u0434. \u0411\u0430\u0440\u043e\u0438 \u0442\u0430\u044a\u043c\u0438\u043d\u0438 \u043a\u043e\u0440\u0438 \u0432\u043e\u0440\u0438\u0434\u043e\u0442, \u0431\u043e\u0432\u0430\u0440\u04e3 \u04b3\u043e\u0441\u0438\u043b \u043a\u0443\u043d\u0435\u0434, \u043a\u0438 \u04b3\u0430\u043c\u0430 \u0433\u0443\u043d\u0430 \u0440\u0430\u043c\u0437\u04b3\u043e\u0438 \u043c\u0430\u04b3\u0441\u0443\u043b\u043e\u0442 \u0451 \u043c\u0430\u043a\u043e\u043d\u04b3\u043e\u0438 \u049b\u0443\u0442\u0442\u0438\u04b3\u043e\u0438 \u043d\u0430\u0432\u0441\u043e\u0437\u04e3, \u043a\u0438 \u0448\u0443\u043c\u043e \u043d\u0430\u0432\u0441\u043e\u0437\u04e3 \u043c\u0435\u043a\u0443\u043d\u0435\u0434, \u0434\u0430\u049b\u0438\u049b \u0432\u043e\u0440\u0438\u0434 \u043a\u0430\u0440\u0434\u0430 \u0448\u0443\u0434\u0430\u0430\u043d\u0434 \u0432\u0430 \u0441\u0430\u0442\u0440\u04b3\u043e\u0438 \u0442\u0430\u043a\u0440\u043e\u0440\u04e3 \u0451 \u0432\u0430\u0440\u0430\u049b\u04b3\u043e\u0440\u043e \u0434\u0430\u0440 \u0441\u0443\u0442\u0443\u043d\u0438 \u0444\u0438\u0437\u0438\u043a\u0438\u0438 QOH \u0442\u0430\u0444\u0442\u0438\u0448 \u043a\u0443\u043d\u0435\u0434.  \u0422\u0430\u0440\u0442\u0438\u0431 \u0451 \u043d\u043e\u043c\u0438 \u0441\u0430\u0440\u043b\u0430\u0432\u04b3\u0430\u04b3\u043e\u0438 \u0441\u0443\u0442\u0443\u043d\u04b3\u043e\u0438 A-H-\u0440\u043e \u0442\u0430\u0493\u0438\u0440 \u043d\u0430\u0434\u0438\u04b3\u0435\u0434. \u0428\u0443\u043c\u043e \u043c\u0435\u0442\u0430\u0432\u043e\u043d\u0435\u0434 \u0441\u0443\u0442\u0443\u043d\u04b3\u043e\u0440\u043e \u043f\u0430\u0441 \u0430\u0437 H \u04b3\u0430\u043d\u0433\u043e\u043c\u0438 \u0437\u0430\u0440\u0443\u0440\u0430\u0442 \u0431\u0438\u0434\u0443\u043d\u0438 \u0442\u0430\u044a\u0441\u0438\u0440 \u0431\u0430 \u0432\u043e\u0440\u0438\u0434\u043e\u0442 \u0438\u043b\u043e\u0432\u0430 \u043a\u0443\u043d\u0435\u0434 \u0451 \u0445\u043e\u0440\u0438\u04b7 \u043a\u0443\u043d\u0435\u0434.
