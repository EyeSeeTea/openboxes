0438 \u0445\u0443\u0434\u0440\u043e \u044d\u04b7\u043e\u0434 \u043a\u0443\u043d\u0435\u0434" \u0442\u043e \u0444\u0430\u0440\u043c\u043e\u0438\u0448\u0433\u0430\u0440\u0438 OpenBox\u04b3\u043e\u0440\u043e \u0431\u0430 \u044d\u04b3\u0442\u0438\u0451\u04b7\u043e\u0442\u0438 \u0442\u0430\u0448\u043a\u0438\u043b\u0438\u0438 \u0445\u0443\u0434 \u043e\u0493\u043e\u0437 \u043a\u0443\u043d\u0435\u0434.
